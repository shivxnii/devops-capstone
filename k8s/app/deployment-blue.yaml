apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskmanager-blue
  namespace: taskmanager
  labels: {app: taskmanager, color: blue}
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector: {matchLabels: {app: taskmanager, color: blue}}
  template:
    metadata:
      labels: {app: taskmanager, color: blue}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "5000", prometheus.io/path: /metrics}
    spec:
      serviceAccountName: taskmanager-sa
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: app
          image: shivanii2507/taskmanager:1.0.0
          ports: [{containerPort: 5000, name: http}]
          envFrom:
            - configMapRef: {name: taskmanager-config}
            - secretRef: {name: taskmanager-secret}
          env: [{name: DEPLOY_COLOR, value: blue}]
          readinessProbe: {httpGet: {path: /readyz, port: http}, initialDelaySeconds: 5, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 256Mi}}
      volumes: [{name: tmp, emptyDir: {}}]
