apiVersion: v1
kind: Namespace
metadata: {name: logging}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: elasticsearch, namespace: logging}
spec:
  serviceName: elasticsearch
  replicas: 1
  selector: {matchLabels: {app: elasticsearch}}
  template:
    metadata: {labels: {app: elasticsearch}}
    spec:
      containers:
        - name: es
          image: docker.elastic.co/elasticsearch/elasticsearch:8.14.1
          env:
            - {name: discovery.type, value: single-node}
            - {name: xpack.security.enabled, value: "false"}
            - {name: ES_JAVA_OPTS, value: "-Xms512m -Xmx512m"}
          ports: [{containerPort: 9200}]
          resources: {requests: {memory: 1Gi}, limits: {memory: 1536Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: elasticsearch, namespace: logging}
spec: {selector: {app: elasticsearch}, ports: [{port: 9200}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: kibana, namespace: logging}
spec:
  replicas: 1
  selector: {matchLabels: {app: kibana}}
  template:
    metadata: {labels: {app: kibana}}
    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:8.14.1
          env: [{name: ELASTICSEARCH_HOSTS, value: "http://elasticsearch:9200"}]
          ports: [{containerPort: 5601}]
---
apiVersion: v1
kind: Service
metadata: {name: kibana, namespace: logging}
spec: {type: NodePort, selector: {app: kibana}, ports: [{port: 5601, nodePort: 30601}]}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: fluentd, namespace: logging}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: fluentd}
rules: [{apiGroups: [""], resources: [pods, namespaces], verbs: [get, list, watch]}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: fluentd}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: fluentd}
subjects: [{kind: ServiceAccount, name: fluentd, namespace: logging}]
---
apiVersion: apps/v1
kind: DaemonSet      # one Fluentd per node: collects container + app + Kubernetes logs from /var/log/containers
metadata: {name: fluentd, namespace: logging}
spec:
  selector: {matchLabels: {app: fluentd}}
  template:
    metadata: {labels: {app: fluentd}}
    spec:
      serviceAccountName: fluentd
      tolerations: [{operator: Exists}]
      containers:
        - name: fluentd
          image: fluent/fluentd-kubernetes-daemonset:v1.17-debian-elasticsearch8-1
          env:
            - {name: FLUENT_ELASTICSEARCH_HOST, value: elasticsearch}
            - {name: FLUENT_ELASTICSEARCH_PORT, value: "9200"}
            - {name: FLUENT_ELASTICSEARCH_SCHEME, value: http}
          volumeMounts: [{name: varlog, mountPath: /var/log}]
          resources: {limits: {memory: 300Mi}, requests: {cpu: 100m, memory: 200Mi}}
      volumes: [{name: varlog, hostPath: {path: /var/log}}]
