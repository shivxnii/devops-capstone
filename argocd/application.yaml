apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: taskmanager, namespace: argocd}
spec:
  project: default
  source:
    repoURL: https://github.com/shivxnii/devops-capstone.git
    targetRevision: main
    path: k8s/app
  destination: {server: https://kubernetes.default.svc, namespace: taskmanager}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
